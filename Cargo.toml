[workspace]
resolver = "2"
members = [
    "crates/arrowhead-core",
    "crates/arrowhead-mcp",
    "crates/arrowhead-cli",
    "crates/arrowhead-daemon",
]

[workspace.package]
version = "0.11.6"
edition = "2024"
rust-version = "1.88"
authors = ["Arrowhead Contributors"]
license = "MIT"
repository = "https://github.com/totocaster/arrowhead"
homepage = "https://github.com/totocaster/arrowhead"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0.100"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.89"
num_cpus = "1.17.0"
futures = "0.3.30"
tracing-appender = "0.2.3"
notify = "6.1.1"

# CLI dependencies
clap = { version = "4.5.50", features = ["derive"] }
directories = "6.0.0"

# Config dependencies
toml = "0.9.8"

# Database dependencies
rusqlite = { version = "0.37.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"

# Vector dependencies
# Pin fastembed to 5.2.0 because newer releases pull image/zune-jpeg combos that fail on stable CI.
fastembed = "=5.2.0"
ndarray = "0.16.1"
sqlite-vec = "0.1.9"
zerocopy = "0.7"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }

# HTTP dependencies
axum = "0.8.6"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "limit"] }

# Parsing dependencies
serde_yaml = "0.9.34"
regex = "1.12.2"
hex = "0.4.3"
ipnet = "2.9.0"
subtle = "2.5.0"
sha2 = "0.10.9"
rand = "0.8.5"

# UI dependencies
indicatif = "0.18.0"
colored = "3.0.0"
ratatui = "0.28.0"
crossterm = { version = "0.27.0", features = ["event-stream"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
