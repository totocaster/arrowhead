[package]
name = "arrowhead-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "arrowhead"
path = "src/main.rs"

[dependencies]
# Core libraries
arrowhead-core = { path = "../arrowhead-core" }
arrowhead-mcp = { path = "../arrowhead-mcp" }
arrowhead-deamon = { path = "../arrowhead-deamon" }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# CLI framework
clap.workspace = true
directories.workspace = true

# Configuration
toml.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio.workspace = true

# Hashing
sha2 = "0.10"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true

# UI (optional features)
indicatif = { workspace = true, optional = true }
colored = { workspace = true, optional = true }

[features]
default = ["ui"]
ui = ["indicatif", "colored"]
vector-lancedb = [
    "arrowhead-core/vector-lancedb",
    "arrowhead-mcp/vector-lancedb",
    "arrowhead-deamon/vector-lancedb",
]

[dev-dependencies]
tempfile = "3.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
